<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="PyCon JP 2026 基調講演『Pyxelで、プログラミングを遊ぼう！──「楽しく作る」をデザインする』のスライドと資料。北尾 崇 / Takashi Kitao"
    />
    <title>PyCon JP 2026 Keynote</title>
    <link rel="canonical" href="{{HOME_URL}}" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0d1117;
        color: #f0f6fc;
        font:
          16px/1.75 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        overflow-wrap: break-word;
      }
      main {
        max-width: 848px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }
      h1 {
        margin: 0 0 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid #3d444d;
        font-size: clamp(1.65rem, 4vw, 2.1rem);
        line-height: 1.35;
        word-break: keep-all;
        overflow-wrap: normal;
      }
      h2 {
        margin: 40px 0 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #3d444d;
        font-size: 1.3rem;
        line-height: 1.45;
        word-break: keep-all;
        overflow-wrap: normal;
      }
      p {
        margin: 0 0 16px;
      }
      ul {
        margin: 24px 0 32px;
        padding-left: 24px;
      }
      li {
        margin: 12px 0;
      }
      a {
        color: #4493f8;
        text-underline-offset: 0.2em;
      }
      a:hover {
        color: #79b8ff;
      }
      a:focus-visible {
        outline: 2px solid #79b8ff;
        outline-offset: 4px;
      }
      code {
        color: #dce7f5;
        font:
          0.875em ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      @media (max-width: 480px) {
        main {
          padding: 28px 20px 48px;
        }
      }
    </style>
  </head>
  <body>
    <main>{{README}}</main>
  </body>
</html>
