# Lint settings for the demo, trailer and tests; CI runs `ruff check`. The production
# tools in tools/ are kept as they were used for the talk.
extend-exclude = ["tools"]
# The oldest Python supported by the demo, trailer and production tools.
target-version = "py311"
# The release in requirements-dev.txt; other releases stop instead of linting
# under different rules.
required-version = "==0.16.10"

[lint]
# The rule set Ruff selected by default before 0.16, named so that the wider defaults of
# later releases do not apply; the Ruff version itself is pinned in CI.
select = ["E4", "E7", "E9", "F"]
