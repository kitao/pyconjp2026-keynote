<h2 id="pyxel-%CB%88p%C9%AAks%C9%99l-a-retro-game-engine">Pyxel (/ˈpɪksəl/), a Retro Game Engine</h2>

<h2 id="why-i-made-pyxel">Why I Made Pyxel</h2>
<div class="why">
<div class="c">
<b>自分のために<span class="en"><span class="aki lead"></span>For myself</span></b>
<div class="a">好きなものを作りたかった<span class="en block"><span class="aki lead"></span>I wanted to build something I loved</span></div>
<i class="ar"></i>
<div class="b">やるならやはり好きなゲーム、<br />題材は思春期を過ごしたレトロゲーム<span class="en block"><span class="aki lead"></span>Then it had to be games —<br />the retro ones I grew up with</span></div>
</div>
<div class="c">
<b>息子のために<span class="en"><span class="aki lead"></span>For my son</span></b>
<div class="a">手軽なプログラミング環境が欲しかった<span class="en block"><span class="aki lead"></span>I wanted an easy programming environment</span></div>
<i class="ar"></i>
<div class="b">既存のゲームエンジンは複雑すぎ、<br />レトロゲーム向けのものは<span class="aki"></span>Lua<span class="aki"></span>が主流だった<span class="en block"><span class="aki lead"></span>The existing engines were too complex,<br />and the retro ones mostly used Lua</span></div>
</div>
<p class="goal">レトロゲームを題材にしたゲームエンジンを自分で作ることにした<span class="en block"><span class="aki lead"></span>I decided to build a retro-game engine of my own</span></p>
</div>

<h1 id="%E3%81%93%E3%82%8C%E3%81%AA%E3%82%89%E3%81%A7%E3%81%8D%E3%81%9D%E3%81%86%E3%81%A8%E6%80%9D%E3%82%8F%E3%81%9B%E3%82%8B%E4%BB%95%E6%8E%9B%E3%81%91" class="hang">「これならできそう」と思わせる仕掛け</h1>
<h2 id="making-it-feel-doable">Making It Feel Doable</h2>
<div class="doable">
<div class="steps">
<div class="step"><div class="n">1</div><div class="w">シンプルで学びやすい<span class="aki"></span>Python<span class="aki"></span>でプログラムを書ける<span class="en block"><span class="aki lead"></span>Write your program in Python — simple and easy to learn</span><span class="d">Python<span class="aki"></span>は文法が素直で読みやすく、解説記事や入門書も多い<span class="en block"><span class="aki lead"></span>Plain syntax, readable code, and plenty of tutorials and books</span></span><img class="pylogo" src="assets/logo/python.svg" alt="Python" /></div></div>
<div class="step"><div class="n">2</div><div class="w">気軽にインストールして、すぐに使い始められる<span class="en block"><span class="aki lead"></span>Install it without fuss and start using it right away</span><span class="d">MIT<span class="aki"></span>ライセンスで無料。どの環境でも<span class="aki"></span>pip install<span class="aki"></span>だけで導入できる<span class="en block"><span class="aki lead"></span>MIT-licensed and free; pip install alone works on any platform</span></span></div></div>
<div class="step"><div class="n">3</div><div class="w">必要ツールが同梱されており、絵や音が簡単に作れる<span class="en block"><span class="aki lead"></span>The tools come with it, so art and sound are easy to make</span><span class="d"><span class="aki lead"></span>外部ツールの購入・習得が不要。簡単な操作でゲーム素材を作成できる<span class="en block"><span class="aki lead"></span>Nothing to buy or learn; simple controls make your game assets</span></span></div></div>
<div class="step hint"><div class="n">4</div><div class="w">あえて「レトロゲーム」らしい制約を入れている<span class="en block"><span class="aki lead"></span>And it deliberately keeps retro-game-style limits</span></div></div>
</div>
<div class="tools">

<h1 id="pyxel%E3%81%AE%E3%83%AC%E3%83%88%E3%83%AD%E3%82%B2%E3%83%BC%E3%83%A0%E5%88%B6%E7%B4%84">Pyxel<span class="aki"></span>の「レトロゲーム」制約</h1>

<h1 id="%E3%82%B2%E3%83%BC%E3%83%A0%E3%82%92%E4%BD%9C%E3%81%A3%E3%81%A6%E3%81%BF%E3%82%88%E3%81%86%E2%91%A0-%E5%9B%B3%E5%BD%A2%E3%82%92%E6%8F%8F%E3%81%8F">ゲームを作ってみよう① 図形を描く</h1>

<p class="lead">描画命令で、キャラクターを描く <span class="en block">Draw the characters with drawing commands</span></p>
<div class="cr" style="--code: 26px">
<div>
<pre><code class="language-python"><span class="cl"><span class="hljs-keyword">import</span> pyxel</span><span class="cl"></span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">init</span>(<span class="hljs-number">160</span>, <span class="hljs-number">120</span>)</span><span class="cl"></span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">cls</span>(<span class="hljs-number">1</span>)</span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">line</span>(<span class="hljs-number">0</span>, <span class="hljs-number">112</span>, <span class="hljs-number">159</span>, <span class="hljs-number">112</span>, <span class="hljs-number">3</span>)</span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">rect</span>(<span class="hljs-number">76</span>, <span class="hljs-number">104</span>, <span class="hljs-number">8</span>, <span class="hljs-number">8</span>, <span class="hljs-number">10</span>)</span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">rect</span>(<span class="hljs-number">40</span>, <span class="hljs-number">20</span>, <span class="hljs-number">8</span>, <span class="hljs-number">8</span>, <span class="hljs-number">8</span>)</span><span class="cl"></span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">show</span>()</span></code></pre>

</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="24" data-paginate="true" data-class="dense ch1 f2" data-theme="pyxel" lang="ja-JP" class="dense ch1 f2" data-marpit-pagination="24" style="--paginate:true;--class:dense ch1 f2;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="%E3%82%B2%E3%83%BC%E3%83%A0%E3%82%92%E4%BD%9C%E3%81%A3%E3%81%A6%E3%81%BF%E3%82%88%E3%81%86%E2%91%A1-%E5%9B%B3%E5%BD%A2%E3%82%92%E5%8B%95%E3%81%8B%E3%81%99">ゲームを作ってみよう② 図形を動かす</h1>
<h2 id="making-a-game-2--moving-the-shapes">Making a Game 2 — Moving the Shapes</h2>
<p class="lead">座標を変えながら描画を繰り返すと、アニメーションになる <span class="en block">Repeat the drawing while shifting the coordinates, and it becomes animation</span></p>
<div class="cr" style="--code: 18px">
<div>
<pre><code class="language-python"><span class="cl"><span class="hljs-keyword">import</span> pyxel</span><span class="cl"></span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">init</span>(<span class="hljs-number">160</span>, <span class="hljs-number">120</span>)</span><span class="cl">enemies = [[<span class="pm">pyxel</span>.<span class="pf">rndi</span>(<span class="hljs-number">0</span>, <span class="hljs-number">152</span>), -i * <span class="hljs-number">16</span>] <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">16</span>)]</span><span class="cl"></span><span class="cl hl"><span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:</span><span class="cl">    <span class="pm">pyxel</span>.<span class="pf">cls</span>(<span class="hljs-number">1</span>)</span><span class="cl">    <span class="pm">pyxel</span>.<span class="pf">line</span>(<span class="hljs-number">0</span>, <span class="hljs-number">112</span>, <span class="hljs-number">159</span>, <span class="hljs-number">112</span>, <span class="hljs-number">3</span>)</span><span class="cl"></span><span class="cl">    <span class="hljs-keyword">for</span> enemy <span class="hljs-keyword">in</span> enemies:</span><span class="cl hl">        enemy[<span class="hljs-number">1</span>] += <span class="hljs-number">2</span></span><span class="cl">        <span class="hljs-keyword">if</span> enemy[<span class="hljs-number">1</span>] &gt; <span class="hljs-number">120</span>:</span><span class="cl">            enemy[<span class="hljs-number">0</span>], enemy[<span class="hljs-number">1</span>] = <span class="pm">pyxel</span>.<span class="pf">rndi</span>(<span class="hljs-number">0</span>, <span class="hljs-number">152</span>), -<span class="hljs-number">8</span></span><span class="cl">        <span class="pm">pyxel</span>.<span class="pf">rect</span>(enemy[<span class="hljs-number">0</span>], enemy[<span class="hljs-number">1</span>], <span class="hljs-number">8</span>, <span class="hljs-number">8</span>, <span class="hljs-number">8</span>)</span><span class="cl"></span><span class="cl">    <span class="pm">pyxel</span>.<span class="pf">rect</span>(<span class="hljs-number">76</span>, <span class="hljs-number">104</span>, <span class="hljs-number">8</span>, <span class="hljs-number">8</span>, <span class="hljs-number">10</span>)</span><span class="cl hl">    <span class="pm">pyxel</span>.<span class="pf">flip</span>()</span></code></pre>
</div>
<div>
<div class="ph"><img class="scr dot" src="assets/steps/2_move.gif" alt="実行画面。敵の四角が8つ、上から次々に降ってくる。自機は動かない" /></div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="25" data-paginate="true" data-class="dense ch1" data-theme="pyxel" lang="ja-JP" class="dense ch1" data-marpit-pagination="25" style="--paginate:true;--class:dense ch1;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="%E3%82%B2%E3%83%BC%E3%83%A0%E3%82%92%E4%BD%9C%E3%81%A3%E3%81%A6%E3%81%BF%E3%82%88%E3%81%86%E2%91%A2-%E3%82%AD%E3%83%BC%E3%81%A7%E6%93%8D%E4%BD%9C%E3%81%99%E3%82%8B">ゲームを作ってみよう③ キーで操作する</h1>
<h2 id="making-a-game-3--controlling-it-with-keys">Making a Game 3 — Controlling It With Keys</h2>
<p class="lead">キー入力で、キャラクターを操作できるようにする <span class="en block">Take key input to make the character controllable</span></p>
<div class="cr" style="--code: 16px">
<div>
<pre><code class="language-python"><span class="cl"><span class="hljs-keyword">import</span> pyxel</span><span class="cl"></span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">init</span>(<span class="hljs-number">160</span>, <span class="hljs-number">120</span>)</span><span class="cl">x = <span class="hljs-number">76</span></span><span class="cl">enemies = [[<span class="pm">pyxel</span>.<span class="pf">rndi</span>(<span class="hljs-number">0</span>, <span class="hljs-number">152</span>), -i * <span class="hljs-number">16</span>] <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">16</span>)]</span><span class="cl"></span><span class="cl"><span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:</span><span class="cl">    <span class="pm">pyxel</span>.<span class="pf">cls</span>(<span class="hljs-number">1</span>)</span><span class="cl">    <span class="pm">pyxel</span>.<span class="pf">line</span>(<span class="hljs-number">0</span>, <span class="hljs-number">112</span>, <span class="hljs-number">159</span>, <span class="hljs-number">112</span>, <span class="hljs-number">3</span>)</span><span class="cl"></span><span class="cl hl">    <span class="hljs-keyword">if</span> <span class="pm">pyxel</span>.<span class="pf">btn</span>(<span class="pm">pyxel</span>.<span class="pk">KEY_LEFT</span>):</span><span class="cl hl">        x -= <span class="hljs-number">2</span></span><span class="cl hl">    <span class="hljs-keyword">if</span> <span class="pm">pyxel</span>.<span class="pf">btn</span>(<span class="pm">pyxel</span>.<span class="pk">KEY_RIGHT</span>):</span><span class="cl hl">        x += <span class="hljs-number">2</span></span><span class="cl"></span><span class="cl">    <span class="hljs-keyword">for</span> enemy <span class="hljs-keyword">in</span> enemies:</span><span class="cl">        enemy[<span class="hljs-number">1</span>] += <span class="hljs-number">2</span></span><span class="cl">        <span class="hljs-keyword">if</span> enemy[<span class="hljs-number">1</span>] &gt; <span class="hljs-number">120</span>:</span><span class="cl">            enemy[<span class="hljs-number">0</span>], enemy[<span class="hljs-number">1</span>] = <span class="pm">pyxel</span>.<span class="pf">rndi</span>(<span class="hljs-number">0</span>, <span class="hljs-number">152</span>), -<span class="hljs-number">8</span></span><span class="cl">        <span class="pm">pyxel</span>.<span class="pf">rect</span>(enemy[<span class="hljs-number">0</span>], enemy[<span class="hljs-number">1</span>], <span class="hljs-number">8</span>, <span class="hljs-number">8</span>, <span class="hljs-number">8</span>)</span><span class="cl"></span><span class="cl">    <span class="pm">pyxel</span>.<span class="pf">rect</span>(x, <span class="hljs-number">104</span>, <span class="hljs-number">8</span>, <span class="hljs-number">8</span>, <span class="hljs-number">10</span>)</span><span class="cl">    <span class="pm">pyxel</span>.<span class="pf">flip</span>()</span></code></pre>
</div>
<div>
<div class="ph"><img class="scr dot" src="assets/steps/3_keys.gif" alt="実行画面。左右キーで自機が左右に動き、降ってくる敵を避ける" /></div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="26" data-paginate="true" data-class="ch1 f2" data-theme="pyxel" lang="ja-JP" class="ch1 f2" data-marpit-pagination="26" style="--paginate:true;--class:ch1 f2;--theme:pyxel;" data-marpit-pagination-total="52">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="27" data-paginate="true" data-class="dense ch1" data-theme="pyxel" lang="ja-JP" class="dense ch1" data-marpit-pagination="27" style="--paginate:true;--class:dense ch1;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="%E3%82%B2%E3%83%BC%E3%83%A0%E3%82%92%E4%BD%9C%E3%81%A3%E3%81%A6%E3%81%BF%E3%82%88%E3%81%86%E2%91%A4-%E7%B5%B5%E3%81%A8%E9%9F%B3%E3%82%92%E5%85%A5%E3%82%8C%E3%82%8B">ゲームを作ってみよう⑤ 絵と音を入れる</h1>
<h2 id="making-a-game-5--adding-the-art-and-sound">Making a Game 5 — Adding the Art and Sound</h2>
<div class="cr" style="--code: 15px">
<div>
<pre><code class="language-python"><span class="cl"><span class="hljs-keyword">import</span> pyxel</span><span class="cl"></span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">init</span>(<span class="hljs-number">160</span>, <span class="hljs-number">120</span>)</span><span class="cl hl"><span class="pm">pyxel</span>.<span class="pf">load</span>(<span class="hljs-string">&quot;game.pyxres&quot;</span>)</span><span class="cl hl"><span class="pm">pyxel</span>.<span class="pf">gen_bgm</span>(<span class="hljs-number">7</span>, <span class="hljs-number">0</span>, <span class="hljs-number">3</span>, <span class="hljs-number">0</span>, play=<span class="hljs-literal">True</span>)</span><span class="cl">x = <span class="hljs-number">76</span></span><span class="cl">enemies = [[<span class="pm">pyxel</span>.<span class="pf">rndi</span>(<span class="hljs-number">0</span>, <span class="hljs-number">152</span>), -i * <span class="hljs-number">16</span>] <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">16</span>)]</span><span class="cl">game_over = <span class="hljs-literal">False</span></span><span class="cl"></span><span class="cl"><span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:</span><span class="cl hl">    <span class="pm">pyxel</span>.<span class="pf">blt</span>(<span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">160</span>, <span class="hljs-number">120</span>)</span><span class="cl"></span><span class="cl">    <span class="hljs-keyword">if</span> <span class="pm">pyxel</span>.<span class="pf">btn</span>(<span class="pm">pyxel</span>.<span class="pk">KEY_LEFT</span>) <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> game_over:</span><span class="cl">        x -= <span class="hljs-number">2</span></span><span class="cl">    <span class="hljs-keyword">if</span> <span class="pm">pyxel</span>.<span class="pf">btn</span>(<span class="pm">pyxel</span>.<span class="pk">KEY_RIGHT</span>) <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> game_over:</span><span class="cl">        x += <span class="hljs-number">2</span></span><span class="cl"></span><span class="cl">    <span class="hljs-keyword">for</span> enemy <span class="hljs-keyword">in</span> enemies:</span><span class="cl">        <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> game_over:</span><span class="cl">            enemy[<span class="hljs-number">1</span>] += <span class="hljs-number">2</span></span><span class="cl">            <span class="hljs-keyword">if</span> enemy[<span class="hljs-number">1</span>] &gt; <span class="hljs-number">120</span>:</span><span class="cl">                enemy[<span class="hljs-number">0</span>], enemy[<span class="hljs-number">1</span>] = <span class="pm">pyxel</span>.<span class="pf">rndi</span>(<span class="hljs-number">0</span>, <span class="hljs-number">152</span>), -<span class="hljs-number">8</span></span><span class="cl">            <span class="hljs-keyword">if</span> <span class="hljs-built_in">abs</span>(enemy[<span class="hljs-number">0</span>] - x) &lt; <span class="hljs-number">8</span> <span class="hljs-keyword">and</span> <span class="hljs-built_in">abs</span>(enemy[<span class="hljs-number">1</span>] - <span class="hljs-number">104</span>) &lt; <span class="hljs-number">8</span>:</span><span class="cl hl">                <span class="pm">pyxel</span>.<span class="pf">play</span>(<span class="hljs-number">3</span>, <span class="hljs-number">0</span>)</span><span class="cl">                game_over = <span class="hljs-literal">True</span></span><span class="cl hl">        <span class="pm">pyxel</span>.<span class="pf">blt</span>(enemy[<span class="hljs-number">0</span>], enemy[<span class="hljs-number">1</span>], <span class="hljs-number">0</span>, <span class="hljs-number">8</span>, <span class="hljs-number">120</span>, <span class="hljs-number">8</span>, <span class="hljs-number">8</span>, <span class="hljs-number">0</span>)</span><span class="cl"></span><span class="cl hl">    <span class="pm">pyxel</span>.<span class="pf">blt</span>(x, <span class="hljs-number">104</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">120</span>, <span class="hljs-number">8</span>, <span class="hljs-number">8</span>, <span class="hljs-number">0</span>)</span><span class="cl">    <span class="pm">pyxel</span>.<span class="pf">flip</span>()</span></code></pre>
</div>
<div>
<div class="ph"><video class="scr" src="assets/steps/5_done.mp4" poster="assets/steps/5_done_poster.png" controls preload="auto"></video></div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="28" data-paginate="true" data-class="ch1 recall f2" data-theme="pyxel" lang="ja-JP" class="ch1 recall f2" data-marpit-pagination="28" style="--paginate:true;--class:ch1 recall f2;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="%E5%88%B6%E7%B4%84%E3%81%AF%E5%AD%A6%E3%81%B3%E3%81%AE%E9%81%93%E5%85%B7%E3%81%A7%E3%82%82%E3%81%82%E3%81%A3%E3%81%9F">制約は「学びの道具」でもあった</h1>
<h2 id="limits-were-also-a-tool-for-learning">Limits Were Also a Tool for Learning</h2>
<p class="lead">ないものは作り、できないことは工夫で越えた。Pyxel<span class="aki"></span>は「あの頃」の再現でもある <span class="en block">You built what didn’t exist and improvised past what you couldn’t do. Pyxel is a recreation of those days</span></p>
<div class="cards left" style="--shot-h: 215px">
<div class="card">
<div class="y">1986年<span class="ymean">プログラムを始めた年</span><span class="en block"><span class="aki lead"></span>I started programming in 1986</span></div>
<div class="w">調べたくてもネットは無い。雑誌やプロの作品から学び、BASIC<span class="aki"></span>が遅ければマシン語で書いた <span class="en block">No internet. You learned from magazines and the pros, and wrote machine code when BASIC lagged</span></div>
<img class="shot" src="assets/hardware/msx2.png" alt="" style="--z:0.753" />
</div>
<div class="card">
<div class="y">1998年<span class="ymean">メタルギアソリッド（PS1）</span><span class="en block">MGS shipped on PS1 in 1998</span></div>
<div class="w">性能では、思い描いた3D<span class="aki"></span>に届かない。ポリゴンを減らし、足りない分は見せ方で補った <span class="en block">The hardware fell short of the 3D we wanted. We cut polygons and made up the rest in the look</span></div>
<img class="shot" src="assets/hardware/ps1.png" alt="" style="--z:0.866" />
</div>
<div class="card">
<div class="y">2001年<span class="ymean">ゾーンオブエンダース（PS2）</span><span class="en block">Z.O.E shipped on PS2 in 2001</span></div>
<div class="w">開発キットは未成熟で、必要なものが揃わない。ゲームより先に、作るための道具から作った <span class="en block">The dev kits were immature and nothing we needed was there. Before the game itself, we built the tools to build it</span></div>
<img class="shot" src="assets/hardware/ps2.png" alt="" style="--z:0.874" />
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="29" data-paginate="true" data-class="ch1 relax" data-theme="pyxel" lang="ja-JP" class="ch1 relax" data-marpit-pagination="29" style="--paginate:true;--class:ch1 relax;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="%E5%88%B6%E7%B4%84%E3%81%AE%E5%A4%96%E3%81%97%E6%96%B9%E3%82%92%E9%81%8A%E3%81%B3%E3%81%AB%E3%81%99%E3%82%8B">制約の外し方を遊びにする</h1>
<h2 id="making-the-way-around-a-limit-into-play">Making the Way Around a Limit Into Play</h2>
<p class="lead">Pyxel<span class="aki"></span>の存在意義は制約。その外し方を隠して、自由度と両立させている <span class="en block">The limits are why Pyxel exists. Hiding the way around them lets limits and freedom coexist</span></p>
<div class="eras" style="--cols: 2; --code: 18px">
<div class="era">
<div class="y">① 制約の解除方法を裏技化 <span class="en block">Turned the way around a limit into a cheat code</span></div>
<div class="w">配列の要素数操作や、隠しクラスのインスタンス登録で、色数や同時発音数を書き換えられる <span class="en block">Resize the arrays or register a hidden class instance, and the color and channel counts change</span></div>
<pre><code class="language-python"><span class="cl">EXTRA_COLORS = [</span><span class="cl">    <span class="hljs-number">0xFF004D</span>, <span class="hljs-number">0xFFA300</span>, <span class="hljs-number">0xFFEC27</span>, <span class="hljs-number">0x00E436</span>,</span><span class="cl">    <span class="hljs-number">0x29ADFF</span>, <span class="hljs-number">0x83769C</span>, <span class="hljs-number">0xFF77A8</span>, <span class="hljs-number">0xFFCCAA</span>,</span><span class="cl">    <span class="hljs-number">0x291814</span>, <span class="hljs-number">0x111D35</span>, <span class="hljs-number">0x422136</span>, <span class="hljs-number">0x125359</span>,</span><span class="cl">    <span class="hljs-number">0x742F29</span>, <span class="hljs-number">0x49333B</span>, <span class="hljs-number">0xA28879</span>, <span class="hljs-number">0xF3EF7D</span>,</span><span class="cl">]</span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">colors</span>[<span class="hljs-number">16</span>:] = EXTRA_COLORS</span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">channels</span>.append(<span class="pm">pyxel</span>.<span class="pf">Channel</span>())</span></code></pre>
<p class="strip"><img class="dot" src="assets/pyxel/palette_32.png" alt="16色から32色に伸ばしたパレット" /></p>
</div>
<div class="era">
<div class="y">② 上級者向け<span class="aki"></span>API<span class="aki"></span>を分離 <span class="en block">Split the advanced API off</span></div>
<div class="w">データの直接操作など、専門知識が必要な<span class="aki"></span>API<span class="aki"></span>を通常時はリファレンスで非表示に。チェックを入れると表示される <span class="en block">APIs needing specialized knowledge, like direct data access, are hidden in the reference until you tick the box</span></div>
<p class="strip shot"><img src="assets/pyxel/api_top.png" alt="Pyxel APIリファレンスの検索欄。右に Advanced のチェックボックスがある" /></p>
<p class="strip shot"><img src="assets/pyxel/api_adv.png" alt="APIリファレンスの一覧。title() には ADV の印が付いている" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="30" data-paginate="true" data-class="ch1 f2" data-theme="pyxel" lang="ja-JP" class="ch1 f2" data-marpit-pagination="30" style="--paginate:true;--class:ch1 f2;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="python%E3%81%AA%E3%82%89%E3%81%A7%E3%81%AF%E3%81%AE%E5%BA%83%E3%81%8C%E3%82%8A">Python<span class="aki"></span>ならではの広がり</h1>
<h2 id="what-python-opened-up">What Python Opened Up</h2>
<p class="lead">日常の<span class="aki"></span>Python<span class="aki"></span>に、出来心で <code>import pyxel</code>。そこから愉快な作品が生まれている <span class="en block">An idle <code>import pyxel</code> in everyday Python — and delightful works keep appearing</span></p>

<div class="w">7インチの<span class="aki"></span>PC<span class="aki"></span>で、デスクトップの代わりに起動。ブラウザも端末もここから開く <span class="en block">It boots on a 7-inch PC in place of the desktop. The browser and terminal open from here</span></div>

</figure>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="31" data-paginate="true" data-class="image-main ch1" data-theme="pyxel" lang="ja-JP" class="image-main ch1" data-marpit-pagination="31" style="--paginate:true;--class:image-main ch1;--theme:pyxel;" data-marpit-pagination-total="52">

<h1 id="pyxel%E3%82%A2%E3%83%97%E3%83%AA%E3%82%B1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E3%83%95%E3%82%A1%E3%82%A4%E3%83%AB">Pyxel<span class="aki"></span>アプリケーションファイル</h1>
<h2 id="pyxel-application-file">Pyxel Application File</h2>
<p class="lead">必要なファイルを1つに詰めた<span class="aki"></span>Pyxel<span class="aki"></span>専用のファイル形式。コマンド1つで作成・実行できる <span class="en block">A Pyxel-specific file format that packs everything into one file — one command to build, one to run</span></p>
<div class="pack">
<div class="step-box before">
<div class="bh"><i class="no">1</i>必要なファイルを揃える <span class="en block">Gather everything it needs</span></div>
<div class="items">
<div class="it"><span class="sq c1"><img class="brand" src="assets/logo/pyodide.png" alt="" /></span><span>Python<span class="aki"></span>のコード <span class="en block">Python files</span></span></div>
<div class="it"><span class="sq c2"><img src="assets/icon/art.svg" alt="" /></span><span>絵と音（.pyxres） <span class="en block">Art and sound</span></span></div>
<div class="it"><span class="sq c3"><img src="assets/icon/data.svg" alt="" /></span><span>その他のファイル <span class="en block">Whatever else it needs</span></span></div>
</div>
</div>
<div class="op"><i class="no">2</i><code>pyxel package</code><span class="ar">→</span><span class="cap">1つにまとめる <span class="en">bundles it into one</span></span></div>
<div class="step-box file">
<img class="big dot" src="assets/pyxel/icon_64.png" alt="" />
<div class="bh">Pyxel<span class="aki"></span>アプリケーション<br />ファイル <span class="en block">Pyxel application file</span></div>
<div class="fn">（.pyxapp）</div>
</div>
<div class="op"><i class="no">3</i><code>pyxel play</code><span class="ar">→</span><span class="cap">実行する <span class="en">runs it</span></span></div>
<div class="step-box after">
<div class="bh"><i class="no">4</i>OS<span class="aki"></span>を選ばず動く <span class="en block">It works on any OS</span></div>
<div class="items">
<div class="it"><span class="sq c4"><img src="assets/icon/play.svg" alt="" /></span><span>Windows・Mac・Linux<span class="aki"></span>対応 <span class="en block">Windows, Mac, and Linux</span></span></div>
<div class="it"><span class="sq c5"><img src="assets/icon/files.svg" alt="" /></span><span>展開も配置も不要 <span class="en block">No unpacking, no placing</span></span></div>
<div class="it"><span class="sq c6"><img src="assets/icon/share.svg" alt="" /></span><span>SNS・ゲームジャムで共有 <span class="en block">Share it online or at a game jam</span></span></div>
</div>
</div>
</div>
<p class="issue"><b>残る課題<span class="en block"><span class="aki lead"></span>Still unsolved</span></b><span class="tx">Python<span class="aki"></span>と<span class="aki"></span>Pyxel<span class="aki"></span>がインストールされた環境でないと、渡しても動かせない <span class="en block">Unless Python and Pyxel are installed, handing it over gets them nowhere</span></span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="35" data-paginate="true" data-class="dense ch2" data-theme="pyxel" lang="ja-JP" class="dense ch2" data-marpit-pagination="35" style="--paginate:true;--class:dense ch2;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="web%E7%89%88pyxel%E3%81%B8%E3%81%AE%E9%81%93%E3%81%AE%E3%82%8A">Web<span class="aki"></span>版<span class="aki"></span>Pyxel<span class="aki"></span>への道のり</h1>
<h2 id="the-road-to-pyxel-on-the-web">The Road to Pyxel on the Web</h2>
<p class="lead">Pyxel<span class="aki"></span>にコミュニティが生まれ、周辺プロジェクトを巻き込んだ総力戦になった <span class="en block">A community formed around Pyxel, and nearby projects were pulled into the effort</span></p>
<div class="chron">
<div class="timeline">
<div class="tp"><div class="y">2018年10月</div><div class="w"><span class="pn"><span class="aki lead"></span>jahodfra</span><span class="aki"></span>氏が「<span class="tm">Brython</span><span class="aki"></span>で動かせないか」と<span class="aki"></span>issue<span class="aki"></span>に書き込み <span class="en block">jahodfra asks in an issue: could Brython run it?</span></div></div>
<div class="tp"><div class="y">2021年12月</div><div class="w">13ヶ月かけて、コアエンジンの<span class="aki"></span>C++から<span class="tm"><span class="aki lead"></span>Rust</span><span class="aki"></span>への移行が完了する <span class="en block">After 13 months, the core engine finishes moving from C++ to <span class="tm">Rust</span></span></div></div>
<div class="tp"><div class="y">2022年5月</div><div class="w"><span class="pn"><span class="aki lead"></span>km19809</span>氏が数ヶ月かけて、コアエンジンの<span class="tm"><span class="aki lead"></span>WASM</span><span class="aki"></span>化に成功する <span class="en block">km19809 spends several months and compiles the core engine to WASM</span></div></div>
<div class="tp"><div class="y">2022年8月</div><div class="w"><span class="tm"><span class="aki lead"></span>maturin</span><span class="aki"></span>の<span class="pn"><span class="aki lead"></span>messense</span><span class="aki"></span>氏と共に、Python<span class="aki"></span>側も<span class="tm"><span class="aki lead"></span>WASM</span><span class="aki"></span>化する <span class="en block">With messense of maturin, we compile the Python side too</span></div></div>
<div class="tp"><div class="y">2022年9月</div><div class="w"><span class="tm"><span class="aki lead"></span>SDL</span><span class="aki"></span>向けに改造した<span class="tm"><span class="aki lead"></span>Pyodide</span><span class="aki"></span>を同梱して、Web<span class="aki"></span>版を公開開始 <span class="en block">Pyxel ships for the web with a Pyodide we modified for SDL</span></div></div>
<div class="tp"><div class="y">2023年4月</div><div class="w"><span class="tm"><span class="aki lead"></span>Pyodide</span><span class="aki"></span>の<span class="pn"><span class="aki lead"></span>Choi</span><span class="aki"></span>氏が<span class="tm"><span class="aki lead"></span>SDL</span><span class="aki"></span>対応を実装。改造版の同梱が不要になる <span class="en block">Choi of Pyodide lands SDL support, and the modified build is no longer bundled</span></div></div>
</div>
<div class="gloss">
<div class="g"><img src="assets/logo/brython.svg" alt="" /><div><b>Brython</b><span>Python<span class="aki"></span>を<span class="aki"></span>JavaScript<span class="aki"></span>に変換して動かす実装 <span class="en block">Runs Python by translating it to JavaScript</span></span></div></div>
<div class="g"><img src="assets/logo/rust.png" alt="" /><div><b>Rust</b><span>Web<span class="aki"></span>等の各種環境向けにコンパイルできる言語 <span class="en block">Compiles to many targets, including the web</span></span></div></div>
<div class="g"><img src="assets/logo/wasm.png" alt="" /><div><b>WASM</b><span><span class="aki lead"></span>ブラウザが直接実行できる、機械語に近い形式 <span class="en block">A near-machine-code format browsers run directly</span></span></div></div>
<div class="g"><img src="assets/logo/pyodide.png" alt="" /><div><b>Pyodide</b><span>Python<span class="aki"></span>本体を<span class="aki"></span>WASM<span class="aki"></span>にコンパイルした実装 <span class="en block">CPython itself, compiled to WASM</span></span></div></div>
<div class="g"><img src="assets/logo/maturin.svg" alt="" /><div><b>maturin</b><span>Rust<span class="aki"></span>製の<span class="aki"></span>Python<span class="aki"></span>拡張をパッケージにするツール <span class="en block">Packages Rust-built Python extensions</span></span></div></div>
<div class="g"><img src="assets/logo/sdl.svg" alt="" /><div><b>SDL</b><span><span class="aki lead"></span>画面・音・入力を扱うライブラリ <span class="en block">A library for screen, sound, and input</span></span></div></div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="36" data-paginate="true" data-class="ch2 f2" data-theme="pyxel" lang="ja-JP" class="ch2 f2" data-marpit-pagination="36" style="--paginate:true;--class:ch2 f2;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="web%E7%89%88pyxel%E3%81%AE%E4%BB%95%E7%B5%84%E3%81%BF">Web<span class="aki"></span>版<span class="aki"></span>Pyxel<span class="aki"></span>の仕組み</h1>
<h2 id="how-pyxel-works-on-the-web">How Pyxel Works on the Web</h2>
<div class="webw">
<div class="steps">
<div class="step"><div class="n">1</div><div class="w">Pyxel<span class="aki"></span>本体を<span class="aki"></span>CDN<span class="aki"></span>サーバーに置き、インストールなしで実行<span class="en block"><span class="aki lead"></span>Pyxel sits on a CDN — it runs with no install</span><span class="d">pyxel.js<span class="aki"></span>スクリプトが、Python<span class="aki"></span>実行環境（Pyodide）と<span class="aki"></span>Pyxel<span class="aki"></span>本体を読み込む<span class="en block"><span class="aki lead"></span>The pyxel.js script pulls in Pyodide (a Python runtime) and Pyxel itself</span></span></div></div>
<div class="step"><div class="n">2</div><div class="w">独自の<span class="aki"></span>HTML<span class="aki"></span>タグを定義し、HTML<span class="aki"></span>内に<span class="aki"></span>Python<span class="aki"></span>を直接記述<span class="en block"><span class="aki lead"></span>A custom HTML tag lets Python live right inside the HTML</span><span class="d"><span class="aki lead"></span>ブラウザがタグを見つけると、中身のコードを取り出して<span class="aki"></span>Pyxel<span class="aki"></span>に渡す<span class="en block"><span class="aki lead"></span>When the browser finds the tag, it hands the code inside to Pyxel</span></span></div></div>
<div class="step"><div class="n">3</div><div class="w">pyxapp<span class="aki"></span>を<span class="aki"></span>Base64エンコードし、単体<span class="aki"></span>HTML<span class="aki"></span>ファイルに変換<span class="en block"><span class="aki lead"></span>A pyxapp is Base64-encoded and turned into a standalone HTML file</span><span class="d"><span class="aki lead"></span>逆変換スクリプトが起動時に<span class="aki"></span>pyxapp<span class="aki"></span>ファイルを復元し、Pyxel<span class="aki"></span>に渡す<span class="en block"><span class="aki lead"></span>At startup a decoder script rebuilds the pyxapp file and passes it to Pyxel</span></span></div></div>
</div>
<div class="webcode">
<pre><code class="language-html"><span class="cl"><span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://<wbr>cdn.jsdelivr.net/<wbr>gh/<wbr>kitao/<wbr>pyxel/<wbr>wasm/<wbr>pyxel.js&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span></span><span class="cl"></span><span class="cl"><span class="hljs-tag">&lt;<span class="hljs-name">pyxel-run</span> <span class="hljs-attr">script</span>=<span class="hljs-string">&quot;</span><span class="cl">import pyxel</span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">init</span>(200, 150)</span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">cls</span>(8)</span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">line</span>(20, 20, 180, 130, 7)</span><span class="cl"><span class="pm">pyxel</span>.<span class="pf">show</span>()</span><span class="cl">&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">pyxel-run</span>&gt;</span></span></code></pre>
<p class="webtry"><a target="_blank" rel="noopener" href="https://kitao.github.io/pyconjp2026-keynote/demo/web/pyxel-run.html">HTML<span class="aki"></span>ファイルを開く</a> <span class="en block">Open the HTML file</span></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="37" data-paginate="true" data-class="dense ch2" data-theme="pyxel" lang="ja-JP" class="dense ch2" data-marpit-pagination="37" style="--paginate:true;--class:dense ch2;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="url%E3%81%A0%E3%81%91%E3%81%A7%E9%81%8A%E3%81%B9%E3%82%8B%E7%A9%B6%E6%A5%B5%E5%BD%A2%E3%81%B8">URL<span class="aki"></span>だけで遊べる究極形へ</h1>
<h2 id="the-ultimate-form-play-from-a-url-alone">The Ultimate Form: Play From a URL Alone</h2>
<p class="lead"><a target="_blank" rel="noopener" href="https://kitao.github.io/pyxel/web/launcher/">Pyxel Web Launcher</a> — GitHub<span class="aki"></span>に置いたファイルを、URL<span class="aki"></span>で指定して起動する <span class="en block">Pyxel Web Launcher — point a URL at a file on GitHub to launch it</span></p>
<p class="urlmap">
<span class="sg fx"><b>https://kitao.github.io/pyxel/web/launcher/</b><i>ランチャーの場所<span class="en block"><span class="aki lead"></span>the launcher</span></i></span>
<span class="sg s1"><b>?run=</b><i>コマンド<span class="en block"><span class="aki lead"></span>command</span></i></span>
<span class="sg s2"><b>taro</b><i><span class="aki lead"></span>ユーザー<span class="en block"><span class="aki lead"></span>user</span></i></span>
<span class="sg sp"><b>/</b></span>
<span class="sg s3"><b>my_repo</b><i><span class="aki lead"></span>リポジトリ<span class="en block"><span class="aki lead"></span>repo</span></i></span>
<span class="sg sp"><b>/</b></span>
<span class="sg s4"><b>main</b><i><span class="aki lead"></span>ブランチ<span class="en block"><span class="aki lead"></span>branch</span></i></span>
<span class="sg sp"><b>/</b></span>
<span class="sg s5"><b>src/title</b><i><span class="aki lead"></span>パス<span class="en block"><span class="aki lead"></span>path</span></i></span></p>
<div class="flow">
<div class="fb"><div class="fh"><span class="sq c1"><img src="assets/icon/link.svg" alt="" /></span><span class="ft-h">URL<span class="aki"></span>を開く<span class="en block"><span class="aki lead"></span>Open the URL</span></span></div><div class="ft"><span><span class="aki lead"></span>ランチャーが<span class="aki"></span>URL<span class="aki"></span>からリポジトリとファイルを読み取る<span class="en block"><span class="aki lead"></span>The launcher reads the repository and file from the URL</span></span></div></div>
<div class="fa"></div>
<div class="fb"><div class="fh"><span class="sq c3"><img src="assets/icon/cloud.svg" alt="" /></span><span class="ft-h">CDN<span class="aki"></span>から取得<span class="en block"><span class="aki lead"></span>Fetch from the CDN</span></span></div><div class="ft"><span>Pyxel<span class="aki"></span>本体と<span class="aki"></span>GitHub<span class="aki"></span>のファイルをダウンロードする<span class="en block"><span class="aki lead"></span>It downloads Pyxel itself and the files from GitHub</span></span></div></div>
<div class="fa"></div>
<div class="fb"><div class="fh"><span class="sq c6"><img src="assets/icon/play.svg" alt="" /></span><span class="ft-h">ブラウザで実行<span class="en block"><span class="aki lead"></span>Run in the browser</span></span></div><div class="ft"><span><span class="aki lead"></span>ダウンロードしたファイルを<span class="aki"></span>Web<span class="aki"></span>版<span class="aki"></span>Pyxel<span class="aki"></span>に渡して動かす<span class="en block"><span class="aki lead"></span>It hands the downloaded files to Pyxel for the web and runs them</span></span></div></div>
</div>
<p class="fnote">共有の準備は必要なく、GitHub<span class="aki"></span>で公開されていれば、そのまま遊べる<span class="en block"><span class="aki lead"></span>No setup to share — if it is public on GitHub, it just plays</span><span class="qrslot"><img src="assets/works/qr_trailer.svg" alt="この講演の予告動画を Web Launcher で開くQRコード" /></span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="38" data-paginate="true" data-class="ch2 f2" data-theme="pyxel" lang="ja-JP" class="ch2 f2" data-marpit-pagination="38" style="--paginate:true;--class:ch2 f2;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="web%E6%8A%80%E8%A1%93%E3%81%A7%E5%BA%83%E3%81%8C%E3%82%8B%E5%8F%AF%E8%83%BD%E6%80%A7">Web<span class="aki"></span>技術で広がる可能性</h1>

</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="39" data-paginate="true" data-class="two-up ch2 demo" data-theme="pyxel" lang="ja-JP" class="two-up ch2 demo" data-marpit-pagination="39" style="--paginate:true;--class:two-up ch2 demo;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="web%E6%8A%80%E8%A1%93%E3%81%AE%E5%BF%9C%E7%94%A8%E2%91%A0-pyxel-code-maker">Web<span class="aki"></span>技術の応用① Pyxel Code Maker</h1>
<h2 id="applying-web-tech-1--pyxel-code-maker">Applying Web Tech 1 — Pyxel Code Maker</h2>
<p class="lead">教室で最初につまずくのは、環境構築 ── なら<span class="aki"></span>IDE<span class="aki"></span>ごと<span class="aki"></span>Web<span class="aki"></span>アプリにしよう <span class="en block">The first wall in a classroom is setup — so make the IDE itself a web app</span></p>
<p class="applink"><span class="hd"><span class="badge"><img class="ic" src="assets/icon/browser.svg" alt="" /></span><span class="ttl"><a class="nm" target="_blank" rel="noopener" href="https://kitao.github.io/pyxel/web/code-maker/">Pyxel Code Maker</a><span class="en block">Pyxel Code Maker</span></span></span><span class="tt kn"><span class="aki lead"></span>ブラウザ上で動く統合開発環境<span class="en block"><span class="aki lead"></span>An IDE that runs in the browser</span></span></p>
<div class="ph wide"><img src="assets/apps/code_maker_lg.png" alt="Pyxel Code Maker の画面。左にPythonのコード、右で実行中" /></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="40" data-paginate="true" data-class="two-up ch2 f2 demo" data-theme="pyxel" lang="ja-JP" class="two-up ch2 f2 demo" data-marpit-pagination="40" style="--paginate:true;--class:two-up ch2 f2 demo;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="web%E6%8A%80%E8%A1%93%E3%81%AE%E5%BF%9C%E7%94%A8%E2%91%A1-pyxel-vs-code%E6%8B%A1%E5%BC%B5">Web<span class="aki"></span>技術の応用② Pyxel VS Code<span class="aki"></span>拡張</h1>
<h2 id="applying-web-tech-2--pyxel-vs-code-extension">Applying Web Tech 2 — Pyxel VS Code Extension</h2>
<p class="lead">VS Code<span class="aki"></span>の中身はブラウザ ── じゃあ、Pyxel<span class="aki"></span>をそのまま動かせるはず <span class="en block">VS Code is a browser inside — so Pyxel should just run there</span></p>
<p class="applink"><span class="hd"><span class="badge"><img class="ic brand" src="assets/logo/vscode.svg" alt="" /></span><span class="ttl"><a class="nm" target="_blank" rel="noopener" href="https://marketplace.visualstudio.com/items?itemName=kitao.pyxel-vscode">Pyxel VS Code<span class="aki"></span>拡張</a><span class="en block"><span class="aki lead"></span>Pyxel VS Code extension</span></span></span><span class="tt">VS Code<span class="aki"></span>上で動く実行環境<span class="en block"><span class="aki lead"></span>A runtime that runs inside VS Code</span></span></p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="41" data-paginate="true" data-class="two-up ch2 demo" data-theme="pyxel" lang="ja-JP" class="two-up ch2 demo" data-marpit-pagination="41" style="--paginate:true;--class:two-up ch2 demo;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="web%E6%8A%80%E8%A1%93%E3%81%AE%E5%BF%9C%E7%94%A8%E2%91%A2-pyxel-mml-studio">Web<span class="aki"></span>技術の応用③ Pyxel MML Studio</h1>
<h2 id="applying-web-tech-3--pyxel-mml-studio">Applying Web Tech 3 — Pyxel MML Studio</h2>
<p class="lead">音楽が文字列で書けるなら ── 曲は<span class="aki"></span>QR<span class="aki"></span>コードに丸ごと入るのでは？ <span class="en block">If music is just text — then maybe a whole tune fits in a QR code?</span></p>
<div class="col-l">
<p class="applink"><span class="hd"><span class="badge"><img class="ic" src="assets/icon/note.svg" alt="" /></span><span class="ttl"><a class="nm" target="_blank" rel="noopener" href="https://kitao.github.io/pyxel/web/mml-studio/">Pyxel MML Studio</a><span class="en block">Pyxel MML Studio</span></span></span><span class="tt">Pyxel MML<span class="aki"></span>の音楽制作ツール<span class="en block"><span class="aki lead"></span>A music tool for Pyxel MML</span></span></p>
<div class="nt"><b>MML（Music Macro Language）</b>音楽を文字列で書く記法<span class="en block"><span class="aki lead"></span>A notation for writing music as text</span><span class="ex"><code>T120 O4 L8 CDEFGAB&gt;C</code><span class="cm"><span class="aki lead"></span>テンポ120・オクターブ4・8分音符で、ドレミファソラシド<span class="en block"><span class="aki lead"></span>Tempo 120, octave 4, eighth notes — then the scale</span></span></span></div>
</div>
<div class="ph wide"><img src="assets/apps/mml_studio_lg.png" alt="Pyxel MML Studio の画面。3チャンネルぶんのMMLが入り、再生中" /></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="42" data-paginate="true" data-class="two-up dense ch2 f2" data-theme="pyxel" lang="ja-JP" class="two-up dense ch2 f2" data-marpit-pagination="42" style="--paginate:true;--class:two-up dense ch2 f2;--theme:pyxel;" data-marpit-pagination-total="52">
<h1 id="%E3%81%BF%E3%82%93%E3%81%AA%E3%81%A8%E4%BD%9C%E3%82%8B%E3%81%AE%E3%81%A3%E3%81%A6%E9%9D%A2%E7%99%BD%E3%81%84-1">みんなと作るのって、面白い</h1>
<h2 id="making-things-together-is-fun-1">Making Things Together Is Fun</h2>

<figure class="ch"><span class="bub">いい音にするね<i><span class="aki lead"></span>I’ll make it sound good</i></span><img class="dot" src="assets/chr/gem_red.png" alt="" /><figcaption>効果音担当<i><span class="aki lead"></span>Sound effects</i><b class="ai">AI</b></figcaption></figure>

<div class="acts"><span>アイデアを出す<i><span class="aki lead"></span>Generate ideas</i></span><span><span class="aki lead"></span>コードを書く<i><span class="aki lead"></span>Write code</i></span><span><span class="aki lead"></span>動かして試す<i><span class="aki lead"></span>Run and test</i></span><span><span class="aki lead"></span>改善する<i><span class="aki lead"></span>Improve</i></span></div>

<h1 id="ai%E6%99%82%E4%BB%A3%E3%81%B8%E3%81%AEpyxel%E3%81%AE%E5%AF%BE%E5%BF%9C">AI<span class="aki"></span>時代への<span class="aki"></span>Pyxel<span class="aki"></span>の対応</h1>
<h2 id="how-pyxel-is-meeting-the-age-of-ai">How Pyxel Is Meeting the Age of AI</h2>
<p class="lead">人の使いやすさはそのままに、AI<span class="aki"></span>用のツールを開発<span class="en block"><span class="aki lead"></span>The same ease of use for people, and tools developed for AI</span></p>

    <rect x="177" y="46" width="7" height="14" rx="3" />
  </g>
  <text x="150" y="47" class="hb" text-anchor="middle">MCP</text>

  <text x="276" y="47" class="sd" text-anchor="middle">Pyxel</text>
</svg><em>AI<span class="aki"></span>と道具をつなぐ共通の差込口<i><span class="aki lead"></span>A common plug between AI and tools</i></em></span></div>
<div class="d">AI<span class="aki"></span>用<span class="aki"></span>Pyxel<span class="aki"></span>操作ツールキット<span class="en block"><span class="aki lead"></span>A Pyxel toolkit for AI</span></div>
<div class="figL"><div class="fts">

<div class="d">AI<span class="aki"></span>用<span class="aki"></span>Pyxel<span class="aki"></span>作業手順書<span class="en block"><span class="aki lead"></span>A Pyxel working guide for AI</span></div>
<div class="figR"><div class="paper"><div class="fn">SKILL.md</div><div class="bd">
<span class="h">## 作る手順<i><span class="aki lead"></span>Workflow</i></span>
<span class="li">1. 遊べる最小の形を見きわめる<i><span class="aki lead"></span>Find the smallest playable scope</i></span>
<span class="li">2. 入口・操作・目的・やり直しを作る<i><span class="aki lead"></span>Build one complete slice</i></span>
<span class="li">3. <code>validate</code> で誤りと警告を確かめる<i><span class="aki lead"></span>Check errors and warnings</i></span>
<span class="li">4. <code>run</code> でコマ0から動かし画面を撮る<i><span class="aki lead"></span>Run from frame 0 and capture</i></span>
<span class="li">5. ログを読み、撮った画面を見る<i><span class="aki lead"></span>Read the log, look at the frame</i></span>
<span class="li">6. 見つけた不具合だけを直す<i><span class="aki lead"></span>Fix only observed defects</i></span>
<span class="li">7. 操作方法と結果を報告する<i><span class="aki lead"></span>Report the controls and results</i></span></div></div></div>
</div>
</div>

<h1 id="pyxel-cube%E3%81%AE%E4%BD%BF%E3%81%84%E6%96%B9">Pyxel Cube<span class="aki"></span>の使い方</h1>
<h2 id="how-to-use-pyxel-cube">How to Use Pyxel Cube</h2>
<p class="lead">ノードツリーで要素を配置。ノードの書き方は、2D<span class="aki"></span>版と同じ考え方 <span class="en block">Arrange things with the node tree. Writing a node follows the same idea as in 2D</span></p>
<div class="ntree">
<div class="tree">
<div class="th">ノードツリー<span class="en block"><span class="aki lead"></span>The node tree</span></div>
<div class="card">
<ul>
<li><span class="row"><span class="nd root">Scene</span><span class="note"><span class="aki lead"></span>場面全体<span class="en block"><span class="aki lead"></span>The whole scene</span></span></span>
<ul>
<li><span class="row"><span class="nd">Field</span><span class="note"><span class="aki lead"></span>マップ<span class="en block"><span class="aki lead"></span>The map</span></span></span></li>
<li><span class="row"><span class="nd">Player</span><span class="note"><span class="aki lead"></span>自機<span class="en block"><span class="aki lead"></span>Your ship</span></span></span>
<ul>
<li><span class="row"><span class="nd">Jet</span><span class="note"><span class="aki lead"></span>ジェットエフェクト（自機に追従）<span class="en block">The jet effect, follows the ship</span></span></span></li>
</ul>
</li>
<li><span class="row"><span class="nd">Enemy</span><span class="note"><span class="aki lead"></span>敵キャラクター<span class="en block"><span class="aki lead"></span>An enemy character</span></span></span>
<ul>
<li><span class="row"><span class="nd">Glare</span><span class="note"><span class="aki lead"></span>発光エフェクト（敵に追従）<span class="en block">The glow effect, follows the enemy</span></span></span></li>
</ul>
</li>
</ul>
</li>
</ul>
</div>
</div>
<div class="code">
<div class="th">Enemy<span class="aki"></span>ノードの中身<span class="en block"><span class="aki lead"></span>Inside the Enemy node</span></div>
<pre><code class="language-python"><span class="cl"><span class="hljs-keyword">from</span> <span class="pm">pyxel</span>.<span class="pf">cube</span> <span class="hljs-keyword">import</span> Node, Vec3</span><span class="cl"></span><span class="cl"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Enemy</span>(<span class="hljs-title class_ inherited__">Node</span>):</span><span class="cl">    <span class="hljs-keyword">def</span> <span class="hljs-title function_">on_update</span>(<span class="hljs-params">self</span>):</span><span class="cl">        <span class="hljs-variable language_">self</span>.transform = <span class="hljs-variable language_">self</span>.transform.translate(</span><span class="cl">            Vec3(<span class="hljs-number">0.05</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>))</span><span class="cl"></span><span class="cl">    <span class="hljs-keyword">def</span> <span class="hljs-title function_">on_draw</span>(<span class="hljs-params">self</span>):</span><span class="cl">        <span class="hljs-variable language_">self</span>.circ(Vec3.ZERO, <span class="hljs-number">0.5</span>, <span class="hljs-number">11</span>)</span><span class="cl">        <span class="hljs-variable language_">self</span>.text(Vec3(<span class="hljs-number">0</span>, <span class="hljs-number">0.8</span>, <span class="hljs-number">0</span>), <span class="hljs-string">&quot;enemy&quot;</span>, <span class="hljs-number">7</span>)</span></code></pre>
</div>

// Marp の bespoke テンプレのキー操作を、この講演の進行に合わせて調整する。
// ビルド後に preview.sh が差し込む。
//
//   数字 → Enter   そのページへ移動（画面には何も出さない。1.8秒放置で破棄）
//   P              無効にする（発表者ツールを使わないので、誤って別ウィンドウが開くのを防ぐ）
//
// 移動は bespoke のハッシュ機能（location.hash = "#21" で21ページ目）に任せる。
(function () {
  var buf = '';
  var timer = null;

  function reset() {
    buf = '';
    if (timer) { clearTimeout(timer); timer = null; }
  }

  function hold() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(reset, 1800);
  }

  // capture 段で受ける。Marp 側のキー処理（document の bubble 段）より先に取る
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.nodeName) || t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    // P は発表者ツールを別ウィンドウで開く。使わないので、ここで握り潰す
    if (e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }

    if (e.key >= '0' && e.key <= '9') {
      buf += e.key;
      hold();
    } else if (buf && e.key === 'Enter') {
      location.hash = '#' + parseInt(buf, 10);
      reset();
    } else if (buf && e.key === 'Backspace') {
      buf = buf.slice(0, -1);
      hold();
    } else {
      return;   // 関係ないキーは Marp に渡す
    }
    e.preventDefault();
    e.stopPropagation();
  }, true);
})();
</script></body></html>
